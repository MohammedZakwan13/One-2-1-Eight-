
name: One2Oneight Production CI/CD

on:
  push:
    branches:
      - feature/supabase-api
  pull_request:
    branches:
      - feature/supabase-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one2oneight-production
  cancel-in-progress: false

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        env:
          APP_ENV: production
          TRUSTED_PROXY: cloudflare
          MSG91_WIDGET_ENABLED: 'true'
          NEXT_PUBLIC_SITE_URL: https://one21eight.com
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "187.127.179.43 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvvimsZNjZpPNVW4RXtidpZGryj9EiQeQJX5yJpNB1z" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'

          set -Eeuo pipefail
          cd /var/www/one2oneight

          OLD_IMAGE=$(docker inspect one21eight-web:production --format='{{.Id}}' 2>/dev/null || true)
          OLD_SHA=$(git rev-parse HEAD 2>/dev/null || true)
          DEPLOY_OK=0

          rollback() {
            # Best effort. Never exits the script, so it cannot hide the original failure.
            if [ -z "$OLD_IMAGE" ]; then
              echo "ROLLBACK SKIPPED: no previous image was found. Manual intervention required." >&2
              return 1
            fi
            echo "Rolling back to previous image ${OLD_IMAGE}..." >&2
            if [ -n "$OLD_SHA" ]; then
              git reset --hard "$OLD_SHA" || echo "Warning: could not restore previous checkout ${OLD_SHA}." >&2
            fi
            docker tag "$OLD_IMAGE" one21eight-web:production || return 1
            docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate || return 1
            for j in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
                echo "Rollback complete: previous version is healthy." >&2
                return 0
              fi
              sleep 5
            done
            echo "Rollback finished but the previous version did not pass its health check." >&2
            return 1
          }

          # Runs on ANY exit (command failure under set -e, or an explicit exit 1 after a failed health check).
          on_exit() {
            status=$?
            trap - EXIT
            if [ "$DEPLOY_OK" != "1" ]; then
              [ "$status" -ne 0 ] || status=1
              echo "Deployment FAILED (exit code ${status})." >&2
              if ! rollback; then
                echo "ROLLBACK FAILED. The site may be down: check the VPS immediately." >&2
              fi
            fi
            exit "$status"
          }
          trap on_exit EXIT

          git fetch origin feature/supabase-api
          git reset --hard "$GITHUB_SHA"

          docker compose -f docker-compose.prod.yml build web
          docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Production deployment healthy."
              DEPLOY_OK=1
              exit 0
            fi

            sleep 5
          done

          echo "Health check failed."
          exit 1

          REMOTE
