name: CI

on:
  push:
    branches: [main, production-readiness, feature/supabase-api]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build/test only - no real secrets exist in CI. Unit tests never contact Supabase.
  APP_ENV: test
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  SUPABASE_URL: https://ci-build.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
  SUPABASE_ANON_KEY: ci-placeholder
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · Types · Unit · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (runtime dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_ENV=staging
            NEXT_PUBLIC_SITE_URL=https://staging.ci-build.invalid
