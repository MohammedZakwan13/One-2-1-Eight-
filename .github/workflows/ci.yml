name: CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test/mock configuration only – no real secrets exist in CI.
  APP_ENV: test
  API_MODE: mock
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  MOCK_ADMIN_EMAIL: ci-admin@localhost.invalid
  MOCK_ADMIN_PASSWORD: ci-only-password-not-a-secret
  MOCK_OTP_CODE: "246810"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · Types · Unit · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (runtime dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_ENV=staging
            NEXT_PUBLIC_SITE_URL=https://staging.ci-build.invalid
            API_BASE_URL=https://api.ci-build.invalid/v1
