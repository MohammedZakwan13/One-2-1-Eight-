services:
  web:
    build:
      context: .
      args:
        APP_ENV: production
        MSG91_WIDGET_ENABLED: 'true'
        NEXT_PUBLIC_SITE_URL: https://one21eight.com
        TRUSTED_PROXY: cloudflare
    image: one21eight-web:production
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      NEXT_PUBLIC_SITE_URL: https://one21eight.com
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 15s
