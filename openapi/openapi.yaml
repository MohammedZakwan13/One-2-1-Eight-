openapi: 3.1.0
info:
  title: ONE 2 1 EIGHT — Storefront & Admin REST API
  version: 1.0.0
  summary: Storefront, customer and Admin/CMS API, implemented on Next.js + Supabase (Postgres, Auth, Storage).
  description: |
    This is the contract AND the description of the implemented API (`lib/backend/*`). A contract test keeps the
    route table and this document in step.

    ## How to call it
    * Browsers and Swagger UI call the **same-origin** API at `/api/v1/*`. Server Components dispatch to the same
      handlers in-process (no network hop).
    * **Authentication** is cookie based. Customers: `POST /auth/otp/verify` sets `o218_session` (HttpOnly).
      Admins: `POST /admin/auth/login` sets `o218_admin_session` (HttpOnly). In Swagger UI, run the login call once;
      the browser keeps the cookie and every later "Try it out" is authenticated automatically.
    * Writes need a CSRF token. Swagger UI adds `X-CSRF-Token` automatically (it calls `GET /csrf-token` first).
      Other clients must call `GET /csrf-token` (it sets the `o218_csrf` cookie) and echo the token in `X-CSRF-Token`.
    * Responses are validated in the browser with Zod schemas mirroring `components/schemas` below
      (`lib/api/schemas.ts`). A response that violates the contract is treated as an error.

    ## Conventions
    * Money: INR in major units (rupees), JSON numbers, at most 2 decimals.
    * Timestamps: ISO-8601. All text is UTF-8.
    * **Everything that touches money, stock or payment state is server-authoritative.** The frontend sends
      identifiers and quantities, never prices, totals, discounts or payment results.
    * Errors use one envelope: `{ "error": { "code", "message", "fieldErrors"?, "requestId"? } }`.
      `message` MUST be safe to show to a shopper (no stack traces, SQL, internal hostnames).
    * Writes (POST/PUT/PATCH/DELETE) require a CSRF token: call `GET /csrf-token` (sets the `o218_csrf` cookie and
      returns the token); send it back in `X-CSRF-Token`. Reject mismatches with 403 `csrf_invalid`.
    * `POST /orders` requires an `Idempotency-Key` header (see operation).
    * Admin routes require an admin session and RBAC. Customers must never reach them.
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000/api/v1
    description: Local server (the running host replaces this in /api/v1/openapi.json)
tags:
  - name: Platform
  - name: Catalogue
  - name: Content
  - name: Cart
  - name: Orders & payments
  - name: Customer auth
  - name: Reviews
  - name: Marketing
  - name: Admin
security: []
paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: "Liveness/readiness probe (used by `/api/health?deep=1`)"
      responses:
        '200':
          description: Backend is healthy
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: ok } } }
  /csrf-token:
    get:
      tags: [Platform]
      operationId: getCsrfToken
      summary: Issue a CSRF token (double-submit cookie)
      description: "Sets cookie `o218_csrf` (HttpOnly, SameSite=Lax) and returns the same value in the body."
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string, minLength: 16 } } }

  /products:
    get:
      tags: [Catalogue]
      operationId: listProducts
      summary: List active products
      parameters:
        - { name: category, in: query, schema: { type: string }, description: Category slug }
        - { name: collection, in: query, schema: { type: string }, description: 'Collection slug (best-sellers, new-arrivals, one-2-1-eight-luxe, layering-edit)' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Free-text search (name, category, colour, fit) }
        - { name: ids, in: query, schema: { type: string }, description: Comma-separated product ids (wishlist hydration, max 100) }
        - { name: sort, in: query, schema: { type: string, enum: [featured, new, price-low, price-high, rating] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 48 } }
      responses:
        '200': { description: Page of products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{slug}:
    get:
      tags: [Catalogue]
      operationId: getProduct
      summary: Get one active product (404 when missing or draft)
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /products/{slug}/related:
    get:
      tags: [Catalogue]
      operationId: getRelatedProducts
      parameters:
        - { $ref: '#/components/parameters/Slug' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 4 } }
      responses:
        '200': { description: Related products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductList' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /products/{slug}/reviews:
    get:
      tags: [Reviews]
      operationId: listProductReviews
      summary: Published reviews + real aggregates
      description: "Only `published` reviews are returned and counted. `summary` MUST be computed from the same set."
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Reviews, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewList' } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Reviews]
      operationId: createProductReview
      summary: Submit a review (signed-in customers only)
      description: |
        The server decides moderation (`pending` recommended) and sets `verifiedPurchase` from order data.
        Apply rate limiting and spam checks. Returns 401 when not signed in.
      security: [{ customerSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReviewRequest' } } } }
      responses:
        '201': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReviewResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      summary: Active categories (stable slugs — renaming a category must not change its slug)
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
  /collections:
    get:
      tags: [Catalogue]
      operationId: listCollections
      summary: Curated collections (edits)
      responses:
        '200': { description: Collections, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Collection' } } } } } } }
  /inventory/availability:
    get:
      tags: [Catalogue]
      operationId: getInventoryAvailability
      summary: Live per-variant availability
      description: Never expose exact stock above the low-stock threshold.
      parameters: [{ name: variantIds, in: query, required: true, schema: { type: string }, description: Comma-separated variant ids (max 100) }]
      responses:
        '200': { description: Availability, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAvailability' } } } }
  /serviceability:
    get:
      tags: [Catalogue]
      operationId: checkServiceability
      summary: Real pincode serviceability / COD / ETA (courier-backed)
      parameters: [{ name: pincode, in: query, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }]
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/Serviceability' } } } }
        '422': { $ref: '#/components/responses/Error' }

  /content/storefront:
    get:
      tags: [Content]
      operationId: getStorefrontContent
      summary: Site settings, active hero slides and active categories
      responses:
        '200': { description: Content, content: { application/json: { schema: { $ref: '#/components/schemas/StorefrontContent' } } } }
  /content/pages/{slug}:
    get:
      tags: [Content]
      operationId: getContentPage
      summary: Published CMS page (terms, privacy, …) — 404 until published
      description: Plain text; paragraphs separated by a blank line. The frontend never renders it as HTML.
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/LegalPage' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Current cart (server creates one on first use and sets a cart cookie)
      description: Totals, discounts and shipping are calculated by the server on every read.
      responses:
        '200': { description: Priced cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a variant (merges with an existing line; capped by availability)
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddCartItemRequest' } } } }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /cart/items/{id}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Set a line quantity (0 removes it)
      security: [{ csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCartItemRequest' } } } }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      security: [{ csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /cart/coupon:
    put:
      tags: [Cart]
      operationId: applyCoupon
      summary: Apply a coupon (422 with a shopper-safe message when not applicable)
      description: Enforce expiry, minimum spend, usage limits and customer eligibility server-side.
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyCouponRequest' } } } }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cart]
      operationId: removeCoupon
      security: [{ csrf: [] }]
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }

  /orders:
    post:
      tags: [Orders & payments]
      operationId: createOrder
      summary: Create an order from the current cart
      description: |
        1. Re-price the cart and **reserve stock atomically**; fail with 409 (`out_of_stock`, `quantity_changed`) if anything changed.
        2. Create the order and a payment with the provider. For `cod`, `payment.action` is null and `paymentStatus` is `cod_pending`.
        3. For online methods return `paymentStatus: pending` and a `payment.action` telling the browser what to do
           (`redirect` to a hosted page, or `sdk` with provider payload). **The order is marked `paid` only by the verified
           provider webhook / `POST /payments/{id}/verify`.**
        4. Empty the cart. Return `lookupToken` so a guest can read the order after the redirect.

        **Idempotency:** the `Idempotency-Key` header is mandatory. Repeating a request with the same key and the same body
        MUST return the original response (status 200) and never create a second order; the same key with a different body
        MUST fail with 422 `idempotency_key_reuse`.
      security: [{ csrf: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } } }
      responses:
        '201': { description: Order created, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderResponse' } } } }
        '200': { description: Idempotent replay of an earlier request, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /orders/{id}:
    get:
      tags: [Orders & payments]
      operationId: getOrder
      summary: Read an order
      description: "Allowed with a matching `token` query parameter (guest lookup) OR when the signed-in customer owns the order. Otherwise 404 (do not reveal existence)."
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: token, in: query, schema: { type: string } }
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /orders/{id}/cancel:
    post:
      tags: [Orders & payments]
      operationId: cancelOrder
      summary: Cancel an order before it ships
      description: "Same access rule as `getOrder` (`token` query for guests, or the owning customer). Allowed only while the order is pending_payment, confirmed, processing or packed; 409 `not_cancellable` after shipping or delivery (use a return instead). Stock is restored exactly once; a paid online order gets a PENDING refund record (never marked refunded here). Repeating the call is harmless. Needs migration 0005 (503 `migration_required` otherwise)."
      security: [{ csrf: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: token, in: query, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 300 } } } } } }
      responses:
        '200': { description: Cancelled order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /orders/{id}/returns:
    post:
      tags: [Orders & payments]
      operationId: requestReturn
      summary: Request a return for delivered items
      description: "Same access rule as `getOrder`. Enforced server-side: order delivered, inside the return window (`returnableUntil`), each item's purchase-time `returnable` snapshot is true, and quantity never exceeds bought minus already-requested. Requesting a return never restocks and never refunds."
      security: [{ csrf: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: token, in: query, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReturnRequest' } } } }
      responses:
        '201': { description: Return created, content: { application/json: { schema: { $ref: '#/components/schemas/Return' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /payments/{id}/verify:
    post:
      tags: [Orders & payments]
      operationId: verifyPayment
      summary: Verify an SDK payment result with the provider
      description: |
        The body `payload` is the provider's client-side result (e.g. Razorpay order/payment ids + signature).
        The server MUST verify the signature / fetch the payment from the provider API and only then update the order.
        Never trust the payload as proof of payment.
      security: [{ csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyPaymentRequest' } } } }
      responses:
        '200': { description: Current payment state, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /me/orders:
    get:
      tags: [Orders & payments]
      operationId: listMyOrders
      security: [{ customerSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Orders, content: { application/json: { schema: { $ref: '#/components/schemas/OrderList' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /auth/otp/config:
    get:
      tags: [Auth]
      operationId: otpConfig
      summary: Public MSG91 widget identifiers (widgetId, tokenAuth) the browser needs to draw the CAPTCHA; never includes the Authkey
      responses:
        '200': { description: Widget identifiers, content: { application/json: { schema: { $ref: '#/components/schemas/OtpConfig' } } } }
        '503': { description: SMS sign-in not configured }
  /auth/otp/request:
    post:
      tags: [Customer auth]
      operationId: requestOtp
      summary: Start an OTP sign-in (rate limit per phone + IP); the code itself is sent by the MSG91 widget in the browser
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } } }
      responses:
        '200': { description: Code sent, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequestResponse' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Customer auth]
      operationId: verifyOtp
      summary: Verify the MSG91 widget access token server-side and start a session (sets the customer session cookie)
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyRequest' } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Customer auth]
      operationId: logout
      security: [{ csrf: [] }]
      responses:
        '204': { description: Signed out (cookie cleared) }
  /me:
    get:
      tags: [Customer auth]
      operationId: getMe
      security: [{ customerSession: [] }]
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /newsletter/subscriptions:
    post:
      tags: [Marketing]
      operationId: subscribeNewsletter
      summary: Subscribe (double opt-in recommended; store the consent record)
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewsletterRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/NewsletterResponse' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /leads:
    post:
      tags: [Marketing]
      operationId: createLead
      summary: Bulk / custom-order enquiry (rate-limit; notify the sales inbox)
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeadRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Error' }

  /admin/auth/login:
    post:
      tags: [Admin]
      operationId: adminLogin
      summary: Admin sign-in (argon2/bcrypt hashes, lockout, rate limits)
      description: "On success sets the admin session cookie (name = `ADMIN_SESSION_COOKIE`, default `o218_admin_session`). When MFA is enabled returns `mfaRequired: true` and an unprivileged partial session."
      security: [{ csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginRequest' } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /admin/auth/mfa:
    post:
      tags: [Admin]
      operationId: adminVerifyMfa
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMfaRequest' } } } }
      responses:
        '200': { description: Fully authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMe' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /admin/auth/logout:
    post:
      tags: [Admin]
      operationId: adminLogout
      security: [{ adminSession: [], csrf: [] }]
      responses:
        '204': { description: Session destroyed server-side and cookie cleared }
  /admin/auth/me:
    get:
      tags: [Admin]
      operationId: adminMe
      summary: Validate the admin session (called by the server-side admin guard on every /admin request)
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Admin, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMe' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /admin/dashboard/summary:
    get:
      tags: [Admin]
      operationId: adminDashboardSummary
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Real aggregates (no fabricated numbers), content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /admin/products:
    get:
      tags: [Admin]
      operationId: adminListProducts
      security: [{ adminSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Products incl. drafts and exact stock, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductList' } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      operationId: adminCreateProduct
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProduct' } } } }
        '409': { $ref: '#/components/responses/Error', description: "`slug_taken` or `sku_taken`." }
        '422': { $ref: '#/components/responses/Error', description: "`validation_failed` (e.g. no `variants`, a stock message claiming a quantity, a custom number outside Custom mode)." }
        '503': { $ref: '#/components/responses/Error', description: "`migration_required`: stock message modes need database migration 0008." }
  /admin/products/bulk-flags:
    post:
      tags: [Admin]
      operationId: adminBulkFlags
      summary: Set a merchandising flag on every product (e.g. clear Luxe)
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkFlagRequest' } } } }
      responses:
        '204': { description: Updated }
  /admin/products/{id}:
    put:
      tags: [Admin]
      operationId: adminUpdateProduct
      description: "Changing a slug must create a redirect from the old URL. Notify the frontend cache (`POST /api/revalidate`)."
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProduct' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: "`slug_taken`, `sku_taken`, `stock_conflict` (stock for a changed or removed size no longer matches `expectedStock`: an order or another update changed it) or `stock_snapshot_required` (an update sent `variants` without `expectedStock`, e.g. from an out-of-date admin page). Nothing was saved in either stock case; refresh the product and repeat the change." }
        '422': { $ref: '#/components/responses/Error', description: "`validation_failed` (e.g. `variants` sent without `expectedStock`, a stock message claiming a quantity, a custom number outside Custom mode)." }
        '503': { $ref: '#/components/responses/Error', description: "`migration_required`: saving products requires database migration 0008." }
    delete:
      tags: [Admin]
      operationId: adminDeleteProduct
      description: "Refuse (409 `product_has_orders`) when the product appears in any order — set it to `draft` instead."
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/categories:
    get:
      tags: [Admin]
      operationId: adminListCategories
      security: [{ adminSession: [] }]
      responses:
        '200': { description: All categories, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
    post:
      tags: [Admin]
      operationId: adminCreateCategory
      summary: Create a category tile
      description: "`slug` is optional (derived from the name). 409 `slug_taken` when the URL exists; 422 when it is reserved for a built-in collection. New categories are appended to the end of the tile order."
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCategoryCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/categories/{id}:
    delete:
      tags: [Admin]
      operationId: adminDeleteCategory
      summary: Delete a category (refused while products or banners still use it)
      description: Never cascades. Returns 409 `category_in_use` when any product (including drafts) or homepage banner still points at the category; move them first.
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      operationId: adminUpdateCategory
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCategoryUpdate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/orders:
    get:
      tags: [Admin]
      operationId: adminListOrders
      security: [{ adminSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Orders, content: { application/json: { schema: { $ref: '#/components/schemas/OrderList' } } } }
  /admin/orders/export.csv:
    get:
      tags: [Admin]
      operationId: adminExportOrders
      description: CSV download. Neutralise spreadsheet formula injection (prefix cells starting with = + - @ with an apostrophe).
      security: [{ adminSession: [] }]
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      operationId: adminUpdateOrderStatus
      description: "Validate transitions (e.g. no `delivered` → `processing`). Cancelling must release reserved stock. Payment status is NOT editable here."
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrderStatusRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/returns:
    get:
      tags: [Admin]
      operationId: adminListReturns
      description: Return requests with order contact details. Empty until migration 0005 is applied.
      security: [{ adminSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Returns, content: { application/json: { schema: { type: object, required: [items, total, page, pageSize], properties: { items: { type: array, items: { $ref: '#/components/schemas/Return' } }, total: { type: integer }, page: { type: integer }, pageSize: { type: integer } } } } } }
  /admin/returns/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateReturn
      description: "Graph: requested to approved|rejected, approved to received, received to refund_pending|completed, refund_pending to completed. Stock returns only at `received` with `restock: true`, once. `completed` requires `refundReference` when money is owed; the refund is only then recorded as completed."
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateReturnRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Return' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/reviews:
    get:
      tags: [Admin]
      operationId: adminListReviews
      security: [{ adminSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, published, hidden] } }
      responses:
        '200': { description: Reviews, content: { application/json: { schema: { $ref: '#/components/schemas/AdminReviewList' } } } }
  /admin/reviews/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateReview
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateReviewStatusRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminReview' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/leads:
    get:
      tags: [Admin]
      operationId: adminListLeads
      security: [{ adminSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string, enum: [new, contacted, qualified, closed] } }
      responses:
        '200': { description: Leads, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLeadList' } } } }
  /admin/leads/export.csv:
    get:
      tags: [Admin]
      operationId: adminExportLeads
      security: [{ adminSession: [] }]
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
  /admin/leads/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateLead
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLeadStatusRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLead' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /admin/content:
    get:
      tags: [Admin]
      operationId: adminGetContent
      summary: Settings and ALL hero slides (including hidden)
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Content, content: { application/json: { schema: { $ref: '#/components/schemas/AdminContent' } } } }
  /admin/content/settings:
    put:
      tags: [Admin]
      operationId: adminUpdateSettings
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreSettings' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreSettings' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /admin/content/luxe-feature:
    get:
      tags: [Admin]
      operationId: adminGetLuxeFeature
      summary: The homepage "THE PRIVATE EDIT" band (null = built-in copy; available is false until migration 0011 is applied)
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Current configuration, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLuxeFeature' } } } }
    put:
      tags: [Admin]
      operationId: adminUpdateLuxeFeature
      summary: Save the homepage "THE PRIVATE EDIT" band. A replaced or removed picture is deleted only after the save and only if nothing else uses it.
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LuxeFeature' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/LuxeFeature' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '503': { description: Database migration 0011 has not been applied yet, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
  /admin/content/hero-slides:
    post:
      tags: [Admin]
      operationId: adminCreateHeroSlide
      summary: Add a hero banner (any number of banners is allowed; it is appended to the end of the carousel)
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeroSlideInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/HeroSlide' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/content/hero-slides/order:
    put:
      tags: [Admin]
      operationId: adminReorderHeroSlides
      summary: Save the carousel order. `ids` must list every banner exactly once; a stale list is refused with 409 order_changed.
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } } } } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/HeroSlide' } } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/content/hero-slides/{id}:
    put:
      tags: [Admin]
      operationId: adminUpdateHeroSlide
      summary: Update a hero banner. With `expectedUpdatedAt`, a banner changed by someone else in the meantime is refused with 409 slide_changed.
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeroSlideInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/HeroSlide' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      operationId: adminDeleteHeroSlide
      summary: Delete a hero banner and any of its image / video files that no other banner uses
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /admin/content/hero-slides/{id}/duplicate:
    post:
      tags: [Admin]
      operationId: adminDuplicateHeroSlide
      summary: Copy a hero banner as a hidden draft placed right after the original (media files are shared, not copied)
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/HeroSlide' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /ready:
    get:
      tags: [Platform]
      operationId: getReady
      summary: Readiness probe — also checks the database connection
      responses:
        '200': { description: Ready, content: { application/json: { schema: { type: object, required: [status], properties: { status: { const: ok }, database: { const: ok } } } } } }
        '503': { description: Database unreachable }
  /me/wishlist:
    get:
      tags: [Customer auth]
      operationId: getWishlist
      summary: Saved wishlist of the signed-in customer
      security: [{ customerSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Wishlist' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/wishlist/{productId}:
    put:
      tags: [Customer auth]
      operationId: addToWishlist
      summary: Save a product (idempotent)
      security: [{ customerSession: [], csrf: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Saved }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Customer auth]
      operationId: removeFromWishlist
      summary: Remove a product
      security: [{ customerSession: [], csrf: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/addresses:
    get:
      tags: [Customer auth]
      operationId: listAddresses
      summary: Saved delivery addresses
      security: [{ customerSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SavedAddress' } } } } } } }
        '4XX': { $ref: '#/components/responses/Error' }
    post:
      tags: [Customer auth]
      operationId: createAddress
      summary: Save a delivery address (max 10)
      security: [{ customerSession: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SavedAddressInput' } } } }
      responses:
        '201': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SavedAddress' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/addresses/{id}:
    delete:
      tags: [Customer auth]
      operationId: deleteAddress
      summary: Delete a saved address
      security: [{ customerSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '4XX': { $ref: '#/components/responses/Error' }
  /admin/pages:
    get:
      tags: [Admin]
      operationId: adminListPages
      summary: Legal / policy pages (published and drafts)
      security: [{ adminSession: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminPage' } } } } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /admin/pages/{slug}:
    put:
      tags: [Admin]
      operationId: adminSavePage
      summary: Create or update a page
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPageInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPage' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      operationId: adminDeletePage
      summary: Delete a page
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '204': { description: Deleted }
        '4XX': { $ref: '#/components/responses/Error' }
  /admin/uploads:
    post:
      tags: [Admin]
      operationId: adminUploadImage
      summary: Upload one image to Supabase Storage
      description: "multipart/form-data with a `file` field. JPEG, PNG, WebP or AVIF, max 4 MB (temporary: Vercel rejects request bodies above about 4.5 MB; larger files get 413 file_too_large). The type is verified from the file's bytes, not its name or declared MIME type. Returns the stable storage path and the public URL."
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/UploadResponse' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUpload
      summary: Delete an uploaded image that is not referenced by any product, category or banner
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
        '4XX': { $ref: '#/components/responses/Error' }
  /admin/uploads/banner-video:
    post:
      tags: [Admin]
      operationId: adminUploadBannerVideo
      summary: Upload one hero banner video to the banner-media bucket
      description: "multipart/form-data with a `file` field. MP4 (H.264) or WebM (VP8/VP9), max 12 MB. The container is verified from the file's bytes, not its name or declared MIME type; MP4 files that only contain HEVC/H.265 or AV1 are refused (422 unsupported_codec). `warnings` may advise re-exporting an MP4 with fast start."
      security: [{ adminSession: [], csrf: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { type: object, required: [path, url], properties: { path: { type: string }, url: { $ref: '#/components/schemas/SafeUrl' }, warnings: { type: array, items: { type: string } } } } } } }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      operationId: adminDeleteBannerVideo
      summary: Delete an uploaded banner video that no banner references
      security: [{ adminSession: [], csrf: [] }]
      parameters: [{ name: path, in: query, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
        '4XX': { $ref: '#/components/responses/Error' }
  /admin/uploads/cleanup:
    post:
      tags: [Admin]
      operationId: adminCleanupUploads
      summary: Remove abandoned uploads (unreferenced and older than 24 hours)
      security: [{ adminSession: [], csrf: [] }]
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, required: [removed], properties: { removed: { type: integer } } } } } }
        '4XX': { $ref: '#/components/responses/Error' }

webhooks:
  razorpayPaymentEvent:
    post:
      summary: Razorpay → server at /api/webhooks/razorpay (NOT called by the frontend)
      description: Signature (X-Razorpay-Signature) is verified over the raw body; events are de-duplicated by X-Razorpay-Event-Id; payment.captured / order.paid settle the payment idempotently.
      responses:
        '200': { description: Acknowledged }
  resendDeliveryEvent:
    post:
      summary: Resend → server at /api/webhooks/resend (delivery tracking only)
      description: Svix signature and 5-minute timestamp window are verified; each svix-id is processed once. Updates email_log delivery status.
      responses:
        '200': { description: Acknowledged }

components:
  securitySchemes:
    customerSession: { type: apiKey, in: cookie, name: o218_session, description: Customer session cookie set by /auth/otp/verify (name is backend-defined). }
    adminSession: { type: apiKey, in: cookie, name: o218_admin_session, description: 'Admin session cookie. The frontend gate reads the name from the ADMIN_SESSION_COOKIE env var.' }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    Slug: { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: "Error envelope. `code` is machine-readable (e.g. validation_failed, unauthorized, forbidden, not_found, conflict, rate_limited, csrf_invalid, out_of_stock, coupon_invalid, stock_conflict, stock_snapshot_required, slug_taken, sku_taken, migration_required, product_unavailable)."
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string, description: Safe to display to shoppers }
            fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }
            requestId: { type: string }
    SafeUrl:
      type: string
      description: "Site-relative path or https URL only. `javascript:`, `data:` and protocol-relative URLs are rejected by the frontend."
      pattern: '^(/(?!/)|https://)\S+$'
    OptionalImageUrl:
      description: "A SafeUrl, or the empty string meaning 'no image'. Never a placeholder URL."
      oneOf:
        - { type: string, maxLength: 0 }
        - { $ref: '#/components/schemas/SafeUrl' }
    Availability:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [in_stock, low_stock, out_of_stock] }
        quantity: { type: integer, minimum: 0, description: "Exact units available for this size. Present ONLY on products whose `stockMessageMode` is `real`; never returned for `none` or `custom` products. 0 means out of stock." }
    Variant:
      type: object
      required: [id, sku, size, availability]
      properties:
        id: { type: string }
        sku: { type: string }
        size: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
    Product:
      type: object
      required: [id, slug, name, category, categorySlug, price, compareAt, color, colorHex, rating, reviewCount, images, fit, material, description, bestSeller, newArrival, luxe, variants, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        category: { type: string, description: Display name }
        categorySlug: { type: string, description: Stable slug }
        price: { type: number, minimum: 0 }
        compareAt: { type: number, minimum: 0, description: 0 or <= price means none }
        color: { type: string }
        colorHex: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        rating: { type: number, minimum: 0, maximum: 5, description: Average of published reviews (0 when none) }
        reviewCount: { type: integer, minimum: 0 }
        badge: { type: [string, 'null'] }
        images: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/SafeUrl' } }
        fit: { type: string }
        material: { type: string }
        description: "{ type: string }"
        bestSeller: { type: boolean }
        newArrival: { type: boolean }
        luxe: { type: boolean }
        returnable: { type: boolean, description: Whether the product can be returned after delivery }
        exchangeable: { type: boolean, description: Whether the product can be exchanged after delivery }
        codEnabled: { type: boolean, description: Whether Cash on Delivery is allowed for this product }
        onlinePaymentEnabled: { type: boolean, description: Whether Online Payment is allowed for this product }
        stockMessage: { type: [string, 'null'], maxLength: 160, description: "Admin-written display text for the product page. Public responses return it only when `stockMessageMode` is `real` (text shown after the real quantity) or `custom`. Pure copy: never derived from, or used as, inventory." }
        stockMessageMode: { type: string, enum: [none, real, custom], description: "`real`: the product page shows the selected size's ACTUAL stock (`variants[].availability.quantity`) followed by `stockMessage`. `custom`: the page shows the admin-entered `stockMessageNumber` + `stockMessage` as promotional text; it is NOT inventory. `none`: no extra message. Absent on legacy data." }
        stockMessageNumber: { type: [integer, 'null'], minimum: 0, maximum: 100000, description: "Promotional display number. Only ever non-null when `stockMessageMode` is `custom`. Never inventory: it does not affect availability, cart limits, checkout or Low Stock." }
        variants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Variant' } }
        updatedAt: { type: string, format: date-time }
    ProductList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Category:
      type: object
      required: [id, name, slug, image, active]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        image: { $ref: '#/components/schemas/OptionalImageUrl' }
        active: { type: boolean }
    Collection:
      type: object
      required: [slug, title, description]
      properties: { slug: { type: string }, title: { type: string }, description: { type: string } }
    InventoryAvailability:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [variantId, sku, availability]
            properties: { variantId: { type: string }, sku: { type: string }, availability: { $ref: '#/components/schemas/Availability' } }
    Serviceability:
      type: object
      required: [pincode, serviceable, codAvailable, estimatedDays]
      properties:
        pincode: { type: string }
        serviceable: { type: boolean }
        codAvailable: { type: boolean }
        estimatedDays: { type: [object, 'null'], required: [min, max], properties: { min: { type: integer, minimum: 1 }, max: { type: integer, minimum: 1 } } }
        message: { type: [string, 'null'] }
    StoreSettings:
      type: object
      required: [brandName, brandLine, promoText, announcementEnabled, freeShippingThreshold, shippingFee, lowStockThreshold, returnPolicy, seoTitle, seoDescription, contactEmail, contactPhone]
      properties:
        brandName: { type: string, maxLength: 80 }
        brandLine: { type: string, maxLength: 160 }
        promoText: { type: string, maxLength: 400 }
        announcementEnabled: { type: boolean }
        freeShippingThreshold: { type: number, minimum: 0 }
        shippingFee: { type: number, minimum: 0, description: Flat fee below the free-shipping threshold }
        lowStockThreshold: { type: integer, minimum: 0, maximum: 1000, description: A size at or below this REAL quantity is low stock }
        returnPolicy: { type: string, maxLength: 2000 }
        seoTitle: { type: string, maxLength: 120 }
        seoDescription: { type: string, maxLength: 320 }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        instagramUrl: { type: [string, 'null'], description: https URL }
        whatsappNumber: { type: [string, 'null'], pattern: '^[0-9]{10,15}$' }
        productOfferCode: { type: [string, 'null'], description: Coupon code advertised on product pages — must exist as a coupon }
        productOfferText: { type: [string, 'null'] }
    HeroSlide:
      allOf:
        - $ref: '#/components/schemas/HeroSlideInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            sortOrder: { type: integer, description: Position in the carousel (1-based, set by the server) }
            updatedAt: { type: string, description: Version stamp; send it back as expectedUpdatedAt when saving }
    HeroSlideInput:
      type: object
      required: [kicker, title, body, desktopImage, mobileImage, cta, href, active]
      description: "`desktopImage` / `mobileImage` are the still pictures (the poster when the slot is a video) and may be empty. Every field added for video support is optional and defaults to the previous behaviour (image slots, own mobile image). A live banner (`active`) must have media for each device it is shown on; a draft may be incomplete."
      properties:
        kicker: { type: string }
        title: { type: string }
        body: { type: string }
        desktopImage: { type: string, description: 'Site-relative path, https URL, or empty' }
        mobileImage: { type: string, description: 'Site-relative path, https URL, or empty' }
        cta: { type: string }
        href: { type: string, pattern: '^/(?!/)\S*$', description: Site-relative path }
        active: { type: boolean }
        desktopMediaType: { type: string, enum: [image, video], default: image }
        desktopVideo: { type: string, default: '' }
        mobileMediaType: { type: string, enum: [image, video], default: image }
        mobileVideo: { type: string, default: '' }
        useDesktopOnMobile: { type: boolean, default: false, description: Phones receive the desktop media }
        altText: { type: string, maxLength: 200, default: '' }
        expectedUpdatedAt: { type: string, description: Updates only; refused with 409 slide_changed when it no longer matches }
    StorefrontContent:
      type: object
      required: [settings, heroSlides, categories, paymentMethods]
      properties:
        luxeFeature: { oneOf: [{ $ref: '#/components/schemas/LuxeFeature' }, { type: 'null' }], description: The homepage Luxe band; null or absent means the built-in copy }
        paymentMethods: { type: array, minItems: 1, items: { type: string, enum: [upi, card, cod] }, description: Online methods are listed only when a payment provider is configured }
        settings: { $ref: '#/components/schemas/StoreSettings' }
        heroSlides: { type: array, items: { $ref: '#/components/schemas/HeroSlide' }, description: Active slides only }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' }, description: Active categories only }
    LegalPage:
      type: object
      required: [slug, title, body, updatedAt]
      properties: { slug: { type: string }, title: { type: string }, body: { type: string }, updatedAt: { type: string, format: date-time } }
    Review:
      type: object
      required: [id, author, rating, title, body, createdAt, verifiedPurchase]
      properties:
        id: { type: string }
        author: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        verifiedPurchase: { type: boolean }
    ReviewList:
      type: object
      required: [summary, items]
      properties:
        summary:
          type: object
          required: [average, count, distribution]
          properties:
            average: { type: number, minimum: 0, maximum: 5 }
            count: { type: integer, minimum: 0 }
            distribution:
              type: object
              required: ['1', '2', '3', '4', '5']
              properties: { '1': { type: integer }, '2': { type: integer }, '3': { type: integer }, '4': { type: integer }, '5': { type: integer } }
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
    CreateReviewRequest:
      type: object
      required: [rating, title, body, authorName]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 8, maxLength: 1200 }
        authorName: { type: string, minLength: 1, maxLength: 70 }
    CreateReviewResponse:
      type: object
      required: [id, status]
      properties: { id: { type: string }, status: { type: string, enum: [pending, published] }, message: { type: [string, 'null'] } }
    Customer:
      type: object
      required: [id, phone]
      properties: { id: { type: string }, phone: { type: string, pattern: '^[6-9][0-9]{9}$' }, name: { type: [string, 'null'] }, email: { type: [string, 'null'] } }
    OtpConfig:
      type: object
      required: [widgetId, tokenAuth]
      properties: { widgetId: { type: string }, tokenAuth: { type: string } }
    OtpRequest:
      type: object
      required: [phone]
      properties: { phone: { type: string, pattern: '^[6-9][0-9]{9}$' } }
    OtpRequestResponse:
      type: object
      required: [requestId, expiresInSeconds, resendAfterSeconds, widgetId, tokenAuth]
      description: Permission to send/retry via the MSG91 OTP Widget (rate limited). widgetId and tokenAuth are the widget's public identifiers.
      properties: { requestId: { type: string }, expiresInSeconds: { type: integer }, resendAfterSeconds: { type: integer }, widgetId: { type: string }, tokenAuth: { type: string } }
    OtpVerifyRequest:
      type: object
      required: [requestId, phone, accessToken]
      description: accessToken is the MSG91 widget's access token; the server verifies it with MSG91 (verifyAccessToken) before creating a session.
      properties: { requestId: { type: string }, phone: { type: string }, accessToken: { type: string } }
    Session:
      type: object
      required: [customer]
      properties: { customer: { $ref: '#/components/schemas/Customer' } }
    CartLine:
      type: object
      required: [id, variantId, productId, slug, name, image, color, size, quantity, unitPrice, compareAt, lineTotal, maxQuantity]
      properties:
        id: { type: string }
        variantId: { type: string }
        productId: { type: string }
        slug: { type: string }
        name: { type: string }
        image: { $ref: '#/components/schemas/OptionalImageUrl' }
        color: { type: string }
        size: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number }
        compareAt: { type: number }
        lineTotal: { type: number }
        maxQuantity: { type: integer, description: "Purchase cap for this line. For products in Real Stock mode it reflects actual availability (min of stock and the per-line limit). For every other product it is only the per-line purchase limit and never reveals stock; the server still enforces real stock." }
        issue: { type: [string, 'null'], enum: [out_of_stock, quantity_reduced, price_changed, null] }
    Totals:
      type: object
      required: [subtotal, discount, shipping, total]
      properties: { subtotal: { type: number }, discount: { type: number }, shipping: { type: number }, total: { type: number } }
    Cart:
      type: object
      required: [id, currency, lines, coupon, totals, freeShippingThreshold, messages]
      properties:
        id: { type: string }
        currency: { const: INR }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        coupon: { type: [object, 'null'], required: [code], properties: { code: { type: string }, description: { type: [string, 'null'] } } }
        totals: { $ref: '#/components/schemas/Totals' }
        freeShippingThreshold: { type: [number, 'null'] }
        messages: { type: array, items: { type: string } }
    AddCartItemRequest:
      type: object
      required: [variantId, quantity]
      properties: { variantId: { type: string }, quantity: { type: integer, minimum: 1, maximum: 20 } }
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties: { quantity: { type: integer, minimum: 0, maximum: 20 } }
    ApplyCouponRequest:
      type: object
      required: [code]
      properties: { code: { type: string, minLength: 1, maxLength: 40 } }
    Address:
      type: object
      required: [line1, city, state, pincode]
      properties:
        line1: { type: string, minLength: 3, maxLength: 200 }
        line2: { type: [string, 'null'] }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
    Contact:
      type: object
      required: [name, phone, email]
      properties: { name: { type: string, minLength: 2 }, phone: { type: string, pattern: '^[6-9][0-9]{9}$' }, email: { type: string, format: email } }
    CreateOrderRequest:
      type: object
      required: [contact, shippingAddress, paymentMethod, acceptedTerms]
      description: No amounts, prices or discounts are accepted — the server prices the cart.
      properties:
        contact: { $ref: '#/components/schemas/Contact' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentMethod: { type: string, enum: [upi, card, cod] }
        acceptedTerms: { const: true }
    OrderLine:
      type: object
      required: [productId, variantId, name, image, size, color, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: string }
        variantId: { type: string }
        name: { type: string }
        image: { $ref: '#/components/schemas/OptionalImageUrl' }
        size: { type: string }
        color: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    Order:
      type: object
      required: [id, number, status, paymentStatus, paymentMethod, currency, totals, lines, contact, shippingAddress, createdAt, history, shipment]
      properties:
        history:
          type: array
          description: Customer-visible fulfilment timeline, oldest first
          items: { type: object, required: [status, at], properties: { status: { type: string }, at: { type: string, format: date-time }, note: { type: [string, 'null'] } } }
        shipment: { type: [object, 'null'], properties: { carrier: { type: [string, 'null'] }, trackingNumber: { type: [string, 'null'] }, trackingUrl: { type: [string, 'null'] } } }
        id: { type: string }
        number: { type: string, description: Human-friendly, sequential, never random }
        status: { type: string, enum: [pending_payment, confirmed, processing, packed, shipped, delivered, cancelled, refunded] }
        paymentStatus: { type: string, enum: [unpaid, pending, paid, failed, cod_pending, refunded], description: Set ONLY from verified provider events (or cod_pending for COD). }
        paymentMethod: { type: string, enum: [upi, card, cod] }
        currency: { const: INR }
        totals: { $ref: '#/components/schemas/Totals' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        contact: { $ref: '#/components/schemas/Contact' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }
        cancellable: { type: boolean, description: Server-decided; true only before shipping }
        cancelReason: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'], format: date-time }
        returnableUntil: { type: [string, 'null'], format: date-time, description: Delivery plus the store return window }
        returns: { type: array, items: { $ref: '#/components/schemas/Return' } }
        refund: { oneOf: [{ $ref: '#/components/schemas/Refund' }, { type: 'null' }], description: Cancellation refund (return refunds are on each return) }
    Refund:
      type: object
      required: [amount, status, reference, method]
      properties: { amount: { type: number }, status: { type: string, enum: [pending, completed, failed] }, reference: { type: [string, 'null'] }, method: { type: string, description: 'manual (COD or bank) or razorpay' } }
    Return:
      type: object
      required: [id, number, orderId, orderNumber, status, reason, adminNote, createdAt, items, refund]
      properties:
        id: { type: string }
        number: { type: string }
        orderId: { type: string }
        orderNumber: { type: string }
        status: { type: string, enum: [requested, approved, rejected, received, refund_pending, completed] }
        reason: { type: string }
        adminNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        restocked: { type: boolean }
        items: { type: array, items: { type: object, required: [orderItemId, name, size, quantity], properties: { orderItemId: { type: string }, name: { type: string }, size: { type: string }, quantity: { type: integer } } } }
        refund: { oneOf: [{ $ref: '#/components/schemas/Refund' }, { type: 'null' }] }
        contact: { $ref: '#/components/schemas/Contact' }
    CreateReturnRequest:
      type: object
      required: [reason, items]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        items: { type: array, minItems: 1, maxItems: 20, items: { type: object, required: [orderItemId, quantity], properties: { orderItemId: { type: string, description: OrderLine.id }, quantity: { type: integer, minimum: 1, maximum: 20 } } } }
    UpdateReturnRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected, received, refund_pending, completed] }
        note: { type: [string, 'null'], maxLength: 500 }
        restock: { type: boolean, description: Only with status=received }
        refundReference: { type: [string, 'null'], maxLength: 120, description: Required with status=completed when money is owed }
    OrderList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    PaymentAction:
      oneOf:
        - type: object
          required: [type, url]
          properties: { type: { const: redirect }, url: { type: string, pattern: '^https://\S+$' } }
        - type: object
          required: [type, provider, payload]
          properties: { type: { const: sdk }, provider: { type: string }, payload: { type: object, additionalProperties: true } }
    Payment:
      type: object
      required: [id, provider, status, action]
      properties:
        id: { type: string }
        provider: { type: string }
        status: { type: string, enum: [unpaid, pending, paid, failed, cod_pending, refunded] }
        action: { oneOf: [{ $ref: '#/components/schemas/PaymentAction' }, { type: 'null' }] }
    CreateOrderResponse:
      type: object
      required: [order, payment, lookupToken]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        payment: { $ref: '#/components/schemas/Payment' }
        lookupToken: { type: string, minLength: 16, description: Unguessable (>= 128 bits), scoped to this order }
    VerifyPaymentRequest:
      type: object
      required: [payload]
      properties: { payload: { type: object, additionalProperties: true } }
    NewsletterRequest:
      type: object
      required: [email, consent]
      properties: { email: { type: string, format: email }, consent: { const: true } }
    NewsletterResponse:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [pending_confirmation, subscribed] } }
    LeadRequest:
      type: object
      required: [name, email, phone, type, quantity, message]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        type: { type: string }
        quantity: { type: string }
        message: { type: string, maxLength: 2000 }
    AdminUser:
      type: object
      required: [id, email, name, role]
      properties: { id: { type: string }, email: { type: string }, name: { type: string }, role: { type: string, enum: [owner, manager, content, support] } }
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, maxLength: 256 } }
    AdminLoginResponse:
      type: object
      required: [mfaRequired, admin]
      properties: { mfaRequired: { type: boolean }, admin: { oneOf: [{ $ref: '#/components/schemas/AdminUser' }, { type: 'null' }] } }
    AdminMfaRequest:
      type: object
      required: [code]
      properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
    AdminMe:
      type: object
      required: [admin]
      properties: { admin: { $ref: '#/components/schemas/AdminUser' } }
    AdminVariant:
      allOf:
        - $ref: '#/components/schemas/Variant'
        - type: object
          required: [stock]
          properties: { stock: { type: integer, minimum: 0 } }
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [categoryId, status, variants]
          properties:
            categoryId: { type: string }
            status: { type: string, enum: [active, draft] }
            variants: { type: array, items: { $ref: '#/components/schemas/AdminVariant' } }
            stockMessageReview: { type: boolean, description: "True while a stock message written before stock modes existed has not been reviewed. Cleared when an admin changes the message or the mode and saves." }
    AdminProductList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminProductInput:
      type: object
      required: [name, slug, categoryId, price, compareAt, color, colorHex, fit, material, description, bestSeller, newArrival, luxe, status]
      description: "Stock is written only on explicit intent. Send `variants` (with `expectedStock` on updates) ONLY when a size quantity was intentionally changed, or when creating a product (required then). A save without `variants` never touches inventory."
      properties:
        returnable: { type: boolean }
        exchangeable: { type: boolean }
        codEnabled: { type: boolean }
        onlinePaymentEnabled: { type: boolean }
        stockMessage: { type: [string, 'null'], maxLength: 160, description: "Display text. In `real`/`custom` mode it must not state a quantity or scarcity (e.g. \"3 left\", \"Only 2 remaining\", \"Last piece\"): 422 validation_failed." }
        stockMessageMode: { type: string, enum: [none, real, custom], description: "Exactly one mode. Omitted = unchanged." }
        stockMessageNumber: { type: [integer, 'null'], minimum: 0, maximum: 100000, description: "Custom display number. Allowed ONLY with `stockMessageMode: custom` (otherwise 422); the database clears it for `real` and `none`. Never inventory." }
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        categoryId: { type: string }
        price: { type: number, minimum: 0 }
        compareAt: { type: number, minimum: 0 }
        color: { type: string }
        colorHex: { type: string }
        badge: { type: [string, 'null'] }
        images: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/SafeUrl' }, description: Optional. Omitted on an update keeps the current images; an explicit empty array removes them all. }
        fit: { type: string }
        material: { type: string }
        description: "{ type: string }"
        bestSeller: { type: boolean }
        newArrival: { type: boolean }
        luxe: { type: boolean }
        status: { type: string, enum: [active, draft] }
        variants:
          type: array
          minItems: 1
          description: "Desired size quantities. Optional on updates (omit for message/metadata-only saves); required when creating. When present on an update, `expectedStock` is required."
          items:
            type: object
            required: [size, stock]
            properties: { size: { type: string }, sku: { type: [string, 'null'] }, stock: { type: integer, minimum: 0 } }
        expectedStock:
          type: object
          description: "Stock per size exactly as loaded with the product (`AdminVariant.stock`). The server locks each size and compares: a size you changed is written only if live stock still equals this value, otherwise the whole save is rejected with 409 `stock_conflict` and nothing is saved. Sizes you did not change are never written."
          additionalProperties: { type: integer, minimum: 0 }
    AdminPage:
      type: object
      required: [slug, title, body, published, updatedAt]
      properties: { slug: { type: string, pattern: '^[a-z0-9-]{1,60}$' }, title: { type: string }, body: { type: string }, published: { type: boolean }, updatedAt: { type: string, format: date-time } }
    AdminPageInput:
      type: object
      required: [title, body, published]
      properties: { title: { type: string, minLength: 1, maxLength: 160 }, body: { type: string, maxLength: 100000 }, published: { type: boolean } }
    UploadResponse:
      type: object
      required: [path, url]
      properties: { path: { type: string, description: Stable Supabase Storage path }, url: { $ref: '#/components/schemas/SafeUrl' } }
    Wishlist:
      type: object
      required: [productIds]
      properties: { productIds: { type: array, items: { type: string } } }
    SavedAddressInput:
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          required: [label, name, phone, isDefault]
          properties: { label: { type: string }, name: { type: string }, phone: { type: string, pattern: '^[6-9][0-9]{9}$' }, isDefault: { type: boolean } }
    SavedAddress:
      allOf:
        - $ref: '#/components/schemas/SavedAddressInput'
        - type: object
          required: [id]
          properties: { id: { type: string } }
    AdminCategoryCreate:
      type: object
      required: [name, active]
      properties: { name: { type: string, maxLength: 80 }, slug: { type: string, maxLength: 60, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }, image: { $ref: '#/components/schemas/OptionalImageUrl' }, active: { type: boolean } }
    AdminCategoryUpdate:
      type: object
      required: [name, active]
      properties: { name: { type: string }, image: { $ref: '#/components/schemas/OptionalImageUrl' }, active: { type: boolean } }
    BulkFlagRequest:
      type: object
      required: [flag, value]
      properties: { flag: { type: string, enum: [luxe, bestSeller, newArrival] }, value: { type: boolean } }
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending_payment, confirmed, processing, packed, shipped, delivered, cancelled, refunded] }
        note: { type: [string, 'null'], maxLength: 500 }
        carrier: { type: [string, 'null'], maxLength: 80, description: Used when status is shipped }
        trackingNumber: { type: [string, 'null'], maxLength: 80 }
        trackingUrl: { type: [string, 'null'], pattern: '^https://', maxLength: 500 }
    AdminReview:
      type: object
      required: [id, productId, productName, author, rating, title, body, status, createdAt, verifiedPurchase]
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        author: { type: string }
        rating: { type: integer }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, published, hidden] }
        createdAt: { type: string, format: date-time }
        verifiedPurchase: { type: boolean }
    AdminReviewList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminReview' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    UpdateReviewStatusRequest:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [pending, published, hidden] } }
    AdminLead:
      allOf:
        - $ref: '#/components/schemas/LeadRequest'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string }
            status: { type: string, enum: [new, contacted, qualified, closed] }
            createdAt: { type: string, format: date-time }
    AdminLeadList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminLead' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    UpdateLeadStatusRequest:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [new, contacted, qualified, closed] } }
    LuxeFeature:
      type: object
      description: The homepage "THE PRIVATE EDIT" band. image may be empty (the band then reuses a banner still). eyebrow and the two description lines may be empty and are then not shown.
      required: [enabled, image, imageAlt, eyebrow, heading, bodyLine1, bodyLine2, ctaLabel, ctaHref]
      properties:
        enabled: { type: boolean }
        image: { $ref: '#/components/schemas/OptionalImageUrl' }
        imageAlt: { type: string, maxLength: 160 }
        eyebrow: { type: string, maxLength: 60 }
        heading: { type: string, minLength: 1, maxLength: 100, description: A line break splits the plain first line from the italic accent line }
        bodyLine1: { type: string, maxLength: 120 }
        bodyLine2: { type: string, maxLength: 120 }
        ctaLabel: { type: string, minLength: 1, maxLength: 40 }
        ctaHref: { type: string, maxLength: 512, pattern: '^/(?!/)\S*$', description: Site-relative path }
    AdminLuxeFeature:
      type: object
      required: [luxeFeature, available]
      properties:
        luxeFeature: { oneOf: [{ $ref: '#/components/schemas/LuxeFeature' }, { type: 'null' }] }
        available: { type: boolean, description: False until database migration 0011 has been applied }
    AdminContent:
      type: object
      required: [settings, heroSlides]
      properties:
        settings: { $ref: '#/components/schemas/StoreSettings' }
        heroSlides: { type: array, items: { $ref: '#/components/schemas/HeroSlide' } }
    DashboardSummary:
      type: object
      required: [orderCount, grossRevenue, productCount, lowStockCount, newArrivalCount, newLeadCount, pendingReviewCount, lowStockItems, orderCountDeltaPercent, revenueDeltaPercent, revenueSeries, recentOrders]
      properties:
        orderCount: { type: integer }
        grossRevenue: { type: number }
        productCount: { type: integer }
        lowStockCount: { type: integer, description: Sizes at or below the threshold, from REAL stock }
        lowStockItems: { type: array, items: { type: object, required: [name, size, sku, stock], properties: { name: { type: string }, size: { type: string }, sku: { type: string }, stock: { type: integer } } } }
        newArrivalCount: { type: integer }
        newLeadCount: { type: integer }
        pendingReviewCount: { type: integer }
        orderCountDeltaPercent: { type: [number, 'null'], description: null when unknown — never invent a value }
        revenueDeltaPercent: { type: [number, 'null'] }
        revenueSeries:
          type: array
          items: { type: object, required: [date, amount], properties: { date: { type: string }, amount: { type: number } } }
        recentOrders: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Order' } }
